<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Consultas</title>

    <link rel="stylesheet" href="./css/agendamento.css" />
</head>

<body>

    <!-- CABEÇALHO -->
    <header class="cabecalho">
        <div>
            <h1 class="cabecalho__titulo">
                <span id="nome-do-sistema">—</span>
            </h1>

            <p class="cabecalho__subtitulo">
                <span id="versao">—</span> ·
                <span id="data-de-hoje">—</span>
            </p>
        </div>
    </header>

    <!-- TELA DE ENTRADA -->
    <section id="tela-entrada" class="entrada">

        <!-- LOGIN -->
        <form class="formulario" id="form-entrar">

            <h2>Entrar</h2>

            <div class="campo">
                <label class="campo__rotulo" for="entrar-email">
                    E-mail
                </label>

                <input class="campo__entrada" id="entrar-email" type="email" autocomplete="email" required />
            </div>

            <div class="campo">
                <label class="campo__rotulo" for="entrar-senha">
                    Senha
                </label>

                <input class="campo__entrada" id="entrar-senha" type="password" autocomplete="current-password"
                    required />
            </div>

            <button class="botao botao--primario" type="submit">
                Entrar
            </button>

        </form>

        <!-- CRIAR CONTA -->
        <form class="formulario" id="form-criar" hidden>

            <h2>Criar conta</h2>

            <div class="campo">
                <label class="campo__rotulo" for="criar-nome">
                    Nome
                </label>

                <input class="campo__entrada" id="criar-nome" type="text" autocomplete="name" required />
            </div>

            <div class="campo">
                <label class="campo__rotulo" for="criar-email">
                    E-mail
                </label>

                <input class="campo__entrada" id="criar-email" type="email" autocomplete="email" required />
            </div>

            <div class="campo">
                <label class="campo__rotulo" for="criar-senha">
                    Senha (6 caracteres ou mais)
                </label>

                <input class="campo__entrada" id="criar-senha" type="password" minlength="6" autocomplete="new-password"
                    required />
            </div>

            <button class="botao botao--primario" type="submit">
                Criar conta
            </button>

        </form>

        <!-- ALTERNAR ENTRE LOGIN E CADASTRO -->
        <button class="botao botao--pequeno" id="alternar-entrada" type="button">
            Ainda não tenho conta
        </button>

        <p class="campo__erro" id="erro-entrada" role="alert"></p>

    </section>

    <!-- APLICAÇÃO PRINCIPAL -->
    <main id="tela-app" hidden>

        <!-- USUÁRIO LOGADO -->
        <div class="cabecalho__acoes">

            <span id="usuario-nome"></span>

            <button id="botao-sair" class="botao botao--pequeno" type="button">
                Sair
            </button>

        </div>

        <!-- FORMULÁRIO DE CADASTRO -->
        <form class="formulario" id="formulario">

            <!-- TÍTULO -->
            <div class="campo">

                <label class="campo__rotulo" for="titulo">
                    Título
                </label>

                <input class="campo__entrada" id="titulo" type="text" autocomplete="off" required minlength="3" />

            </div>

            <!-- PRIORIDADE -->
            <div class="campo">

                <label class="campo__rotulo" for="prioridade">
                    Prioridade
                </label>

                <select class="campo__selecao" id="prioridade">
                    <option value="baixa">Baixa</option>
                    <option value="media" selected>Média</option>
                    <option value="alta">Alta</option>
                </select>

            </div>

            <!-- ESPECIALIDADE -->
            <div class="campo">

                <label class="campo__rotulo" for="especialidade">
                    Especialidade
                </label>

                <select class="campo__selecao" id="especialidade">
                    <option value="cardiologia">Cardiologia</option>
                    <option value="gastroenterologia">Gastroenterologia</option>
                    <option value="geriatria">Geriatria</option>
                    <option value="endocrinologia">Endocrinologia</option>
                </select>

            </div>

            <!-- Cadastro de procedimentos -->
            <div class="campo campo--procedimentos">
                <label class="campo__rotulo" for="procedimento">
                    Procedimentos
                </label>

                <div class="procedimento__entrada">
                    <input class="campo__entrada" id="procedimento" type="text" placeholder="Digite um procedimento..."
                        autocomplete="off" />

                    <button class="botao botao--adicionar" id="adicionar-procedimento" type="button">
                        + Adicionar
                    </button>
                </div>

                <ul class="procedimento__lista" id="lista-procedimentos" aria-label="Procedimentos adicionados"></ul>

                <p class="campo__erro" id="erro-procedimentos" role="alert"></p>
            </div>

            <!-- CADASTRAR -->
            <button class="botao botao--primario" type="submit">
                Cadastrar
            </button>

        </form>

        <!-- ERROS DO CADASTRO -->
        <p class="campo__erro" id="erro" role="alert"></p>

        <!-- ESTATÍSTICAS -->
        <ul class="estatisticas">

            <li class="estatistica">
                <span class="estatistica__numero" id="marcada">0</span>

                <span class="estatistica__rotulo">
                    Marcada
                </span>
            </li>

            <li class="estatistica">
                <span class="estatistica__numero" id="confirmada">0</span>

                <span class="estatistica__rotulo">
                    Confirmada
                </span>
            </li>

            <li class="estatistica">
                <span class="estatistica__numero" id="realizada">0</span>

                <span class="estatistica__rotulo">
                    Realizada
                </span>
            </li>

            <li class="estatistica">
                <span class="estatistica__numero" id="cancelada">0</span>

                <span class="estatistica__rotulo">
                    Cancelada
                </span>
            </li>

        </ul>

        <!-- SUGESTÃO DE CONSULTA -->
        <p class="aviso" id="comece-por" hidden></p>

        <!-- LISTAGEM DE CONSULTAS -->
        <ul class="lista" id="lista"></ul>

    </main>

    <!-- SCRIPT PRINCIPAL -->
    <script type="module" src="./src/main.ts"></script>

</body>

</html>
